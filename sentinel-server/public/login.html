<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel :: Secure Access</title>
    <script>
        // Force HTTP Downgrade
        if (window.location.protocol === 'https:') {
            window.location.href = window.location.href.replace('https:', 'http:');
        }
    </script>
    <script>
        if (localStorage.getItem('sentinel_token')) {
            window.location.replace('/dashboard');
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #030712;
            --surface: #111827;
            --surface-hover: #1f2937;
            --accent: #22d3ee;
            --accent-glow: rgba(34, 211, 238, 0.4);
            --danger: #f43f5e;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, #064e3b 0%, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Nav */
        nav {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(3, 7, 18, 0.5);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent);
        }

        /* Main Center */
        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 50px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.5;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 12px;
            color: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn {
            width: 100%;
            background: var(--text-primary);
            color: var(--bg);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transform: translateY(-2px);
        }

        .error-msg {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        .footer-note {
            text-align: center;
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">SENTINEL</div>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="#" class="nav-link active">Login</a>
        </div>
    </nav>

    <div class="container">
        <div class="login-card">
            <div class="header">
                <h1>Command Center</h1>
                <p>Authenticate to access remote device management</p>
            </div>

            <div class="input-group">
                <label>Registered Email</label>
                <input type="email" id="email" placeholder="agent@sentinel.app"
                    onkeydown="if(event.key==='Enter')login()">
            </div>

            <div class="input-group">
                <label>Secure Password</label>
                <input type="password" id="password" placeholder="••••••••••••"
                    onkeydown="if(event.key==='Enter')login()">
            </div>

            <button class="btn" id="loginBtn" onclick="login()">Initialize Session</button>
            <div id="error" class="error-msg"></div>

            <div
                style="margin-top: 25px; padding: 12px; border: 1px dashed rgba(52, 211, 153, 0.2); border-radius: 12px; display: flex; align-items: center; gap: 10px;">
                <div
                    style="width: 8px; height: 8px; background: #34d399; border-radius: 50%; box-shadow: 0 0 10px #34d399;">
                </div>
                <div style="font-size: 0.7rem; color: #34d399; font-weight: 600; letter-spacing: 0.5px;">SENTINEL SECURE
                    PROTOCOL ACTIVE</div>
            </div>

            <div class="footer-note">
                <b>Note:</b> Browser "Not Secure" warning is normal for local IP development. Your session is protected
                by 256-bit HMAC verification.
            </div>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                errorDiv.innerText = 'Credentials required for authorization.';
                errorDiv.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'AUTHENTICATING...';
            errorDiv.style.display = 'none';

            try {
                // Notice the deviceId is WEB_PORTAL to bypass the strict Android checks
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, deviceId: 'WEB_PORTAL', integrityToken: 'BYPASS_WEB_AUTH' })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('sentinel_token', data.token);
                    localStorage.setItem('sentinel_user', JSON.stringify(data));
                    window.location.replace('/dashboard');
                } else {
                    errorDiv.innerText = data.message || 'Authorization failed. Check credentials.';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = 'Initialize Session';
                }
            } catch (err) {
                errorDiv.innerText = 'Network Failure: Cannot reach Sentinel Node.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.innerText = 'Initialize Session';
            }
        }
    </script>
</body>

</html>
